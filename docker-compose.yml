services:
  postgres:
    image: ankane/pgvector:latest
    container_name: artiproof-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-artiproof}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artiproof}
      POSTGRES_DB: ${DB_NAME:-artiproof}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-artiproof} -d ${DB_NAME:-artiproof}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - artiproof-network

  redis:
    image: redis:7-alpine
    container_name: artiproof-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-artiproof-redis-dev}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-artiproof-redis-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - artiproof-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artiproof-backend
    restart: unless-stopped
    volumes:
      - analysis_uploads:/app/uploads
      - analysis_reports:/app/reports
      - analysis_artifacts:/app/artifacts
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-artiproof}:${DB_PASSWORD:-artiproof}@postgres:5432/${DB_NAME:-artiproof}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-artiproof}:${DB_PASSWORD:-artiproof}@postgres:5432/${DB_NAME:-artiproof}
      REDIS_URL: redis://:${REDIS_PASSWORD:-artiproof-redis-dev}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - artiproof-network

  # Celery worker + beat. Same image as the API but runs the task queue
  # instead. In production (Railway) this maps to a second service with
  # the same Dockerfile and the startCommand from backend/railway-worker.toml.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artiproof-worker
    restart: unless-stopped
    volumes:
      - analysis_uploads:/app/uploads
      - analysis_reports:/app/reports
      - analysis_artifacts:/app/artifacts
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-artiproof}:${DB_PASSWORD:-artiproof}@postgres:5432/${DB_NAME:-artiproof}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-artiproof}:${DB_PASSWORD:-artiproof}@postgres:5432/${DB_NAME:-artiproof}
      REDIS_URL: redis://:${REDIS_PASSWORD:-artiproof-redis-dev}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - artiproof-network

volumes:
  analysis_artifacts:
    driver: local
  analysis_uploads:
    driver: local
  analysis_reports:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  artiproof-network:
    driver: bridge
