[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quiet third-party noise during test runs
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:passlib.*

# Markers — `@pytest.mark.integration` opts into tests that need a real
# Postgres + Redis. Run only unit tests by default:
#     pytest                                 # unit tests
#     pytest -m "not integration"            # explicit
#     pytest -m integration                  # integration only
markers =
    integration: requires a running Postgres + Redis (CI only)
    slow: takes > 1s; skip locally with `-m "not slow"`

addopts = -m "not integration"
