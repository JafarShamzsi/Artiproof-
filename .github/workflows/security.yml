name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python high severity / high confidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone nonlicensed scanner and contract-test parser
        run: python -m pip install bandit==1.9.4 PyYAML==6.0.3
      - name: Release-gate contract regressions
        run: python .github/workflows/tests/test_release_gates.py
      - name: Scan Python (findings and tool errors fail)
        run: |
          mkdir -p security-results
          bandit -r backend/app -lll -iii -f json -o security-results/bandit.json
          # Bandit can return zero despite skipped files/internal errors.
          python -c "import json; r=json.load(open('security-results/bandit.json')); assert not r['errors'], r['errors']; assert r['metrics']['_totals']['loc'] > 0, 'No code scanned'"
      - name: Security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-results/
          retention-days: 7
          if-no-files-found: warn
